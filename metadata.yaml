name: astrbot_plugin_chaoxing_ddl
display_name: 学习通作业DDL提醒
short_desc: 自动读取学习通未交作业截止时间，剩最后 N 天在 QQ 等平台主动推送提醒
desc: |
  学习通（超星）作业 / DDL 提醒插件。

  功能：
  - 自动登录学习通，定时抓取所有课程的未交作业与截止时间（无时间限制作业也会列出）
  - 进入自定义提醒窗口（如剩最后 2 天）后主动推送提醒，每条只推一次，重启不重复
  - 每日固定时刻推送「未交作业一览」（可选，可关闭）
  - 零配置可用：账号可直接在聊天里设置，支持密码 / 手机短信验证码 / Cookie 三种登录方式
  - 支持图形验证码交互、登录态持久化、被踢下线自动重登、巡检失败告警
  - 支持课程过滤、考试提醒（best-effort）、课程与作业手动查询

  指令：作业 / 课程 / cxhelp / cxlogin / cxbind / cxcheck 等，发「cxhelp」查看全部。
help: |
  零配置使用：安装后直接发送 cxlogin，机器人会引导你输入手机号并选择登录方式
  （密码 / 手机短信验证码 / Cookie），配完自动开始巡检。

  常用命令：
  - 作业：查询全部未交作业及截止时间；「作业 全部」可查看含已完成的状态原文（诊断）
  - 课程：查看我的课程列表；「课程 2」或「课程 高数」查看单门课未交作业
  - cxhelp：命令一览 + 当前运行状态（别名：帮助 / 命令）
  - cxlogin：登录 / 重选登录方式（没配账号时引导设置）
  - cxsetphone / cxpwd：单独设置手机号 / 密码
  - cxaccount：查看账号与登录状态
  - cxcode 123456：提交验证码（短信 / 图形通用）
  - cxsetcookie <cookie>：粘贴浏览器 Cookie 直接登录
  - cxbind / cxunbind：绑定 / 解绑当前会话接收提醒
  - cxcheck：立即巡检一次
version: v0.5.1
category: integrations
author: WuHen
repo: https://github.com/yiwuhen/astrbot_plugin_chaoxing_ddl
support_platforms:
